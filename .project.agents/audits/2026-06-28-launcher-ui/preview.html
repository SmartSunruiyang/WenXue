			const settings = {

					{

						outputTokens: 9600,
						totalTokens: 49600,
						estimatedCostCny: 3.68,

				],
				recent: [
					{
						id: 'usage_1',
						ts: now - 1000 * 60 * 4,

						outputTokens: 940,
						totalTokens: 4740,
						estimatedCostCny: 0.37,
					},
				],
			}

			globalThis.wenxue = {
				browser: {
					launch: async () => ({ ok: true }),
					launchProfile: async (profileId) => {
						statuses = { ...statuses, [profileId]: 'running' }
						return { ok: true }
					},
					stopProfile: async (profileId) => {
						statuses = { ...statuses, [profileId]: 'idle' }
						return { ok: true }
					},
					listProfiles: async () => profiles,
					addProfile: async () => ({ ok: true, profile: profiles[0] }),
					renameProfile: async (profileId, displayName) => ({
						ok: true,
						profile: profiles.find((profile) => profile.id === profileId) ?? {
							...profiles[0],
							displayName,
						},
					}),
					duplicateProfile: async () => ({ ok: true, profile: profiles[1] }),
					removeProfile: async () => ({ ok: true, profile: profiles[2] }),
					openProfileFolder: async () => ({ ok: true }),
					getStatus: async () => 'running',
					getStatuses: async () => statuses,
					onStatusChange: () => () => undefined,
					onProfileStatusChange: () => () => undefined,
				},
				logs: {
					query: async () => logs,
					clear: async () => ({ ok: true }),
				},
				settings: {
					get: async () => settings,
					update: async (patch) => ({
						ok: true,
						settings: {
							...settings,
							launch: { ...settings.launch, ...(patch.launch ?? {}) },
							behavior: { ...settings.behavior, ...(patch.behavior ?? {}) },
							logs: { ...settings.logs, ...(patch.logs ?? {}) },
							localUser: { ...settings.localUser, ...(patch.localUser ?? {}) },
						},
					}),
				},
				tokens: {
					getSummary: async () => tokens,
				},
				app: {
					getVersions: async () => ({
						app: '0.0.0',
						browser: '138.0.7204.0',
						extension: '0.0.1',
					}),
					getShellInfo: async () => ({
						platform: 'darwin',
						frameless: false,
						hasSystemTrafficLights: true,
						isMaximized: false,
					}),
					openLogs: async () => ({ ok: true }),
					minimizeWindow: async () => ({ ok: true }),
					toggleMaximizeWindow: async () => ({ ok: true }),
					requestClose: async () => ({ ok: true }),
				},
			}
			await import('/src/main.tsx')
		</script>
	</body>
</html>
