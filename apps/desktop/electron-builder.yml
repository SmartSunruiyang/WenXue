appId: com.wenxue.launcher
productName: 问学
asar: true
# Ed25519 binds release artifacts; ad-hoc macOS sealing does not provide platform trust.
forceCodeSigning: false
publish:
  provider: generic
  url: https://askwenxue.com/desktop-releases/

directories:
  output: release

artifactName: WenXue-${version}-${os}-${arch}.${ext}

extraResources:
  - from: ../../.browsers
    to: browser
  - from: ../extension/.output/chrome-mv3
    to: extension

mac:
  icon: resources/app-icon-macos.icns
  category: public.app-category.productivity
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target: dmg

dmg:
  icon: resources/app-icon-macos.icns

win:
  icon: resources/app-icon-windows.ico
  signExecutable: false
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/app-icon-windows.ico
  uninstallerIcon: resources/app-icon-windows.ico
  installerHeader: resources/installer-header-150x57.bmp
  installerSidebar: resources/installer-sidebar-164x314.bmp
  uninstallerSidebar: resources/installer-sidebar-164x314.bmp
