<!doctype html>
<html lang="zh-CN" dir="ltr" xmlns:o="urn:schemas-microsoft-com:office:office">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="x-apple-disable-message-reformatting" />
		<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
		<meta name="color-scheme" content="light" />
		<meta name="supported-color-schemes" content="light" />
		<title>问学 · 邮箱验证码</title>
		<!--[if mso]>
			<xml>
				<o:OfficeDocumentSettings>
					<o:AllowPNG />
					<o:PixelsPerInch>96</o:PixelsPerInch>
				</o:OfficeDocumentSettings>
			</xml>
		<![endif]-->
		<style>
			body,
			table,
			td,
			p,
			h1,
			a {
				-webkit-text-size-adjust: 100%;
				-ms-text-size-adjust: 100%;
			}

			a[x-apple-data-detectors] {
				color: inherit !important;
				text-decoration: none !important;
			}

			@media screen and (min-width: 480px) {
				.email-background {
					padding-top: 48px !important;
					padding-bottom: 48px !important;
				}

				.letter-padding {
					padding: 40px !important;
				}

				.verification-code {
					letter-spacing: 6px !important;
				}
			}
		</style>
	</head>
	<body
		bgcolor="#fcfcfb"
		style="
			width: 100%;
			margin: 0;
			padding: 0;
			background-color: #fcfcfb;
			color: #171717;
			font-family:
				system-ui,
				-apple-system,
				BlinkMacSystemFont,
				'PingFang SC',
				'Microsoft YaHei',
				sans-serif;
			-webkit-text-size-adjust: 100%;
			-ms-text-size-adjust: 100%;
		"
	>
		<div
			aria-hidden="true"
			style="
				display: none !important;
				max-height: 0;
				max-width: 0;
				overflow: hidden;
				opacity: 0;
				color: #fcfcfb;
				font-size: 1px;
				line-height: 1px;
				mso-hide: all;
			"
		>
			请返回问学输入邮件中的验证码，继续完成当前操作。如非本人操作，请忽略此邮件。
		</div>
		<table
			role="presentation"
			width="100%"
			border="0"
			cellpadding="0"
			cellspacing="0"
			bgcolor="#fcfcfb"
			style="
				width: 100%;
				border-collapse: collapse;
				background-color: #fcfcfb;
				mso-table-lspace: 0;
				mso-table-rspace: 0;
			"
		>
			<tr>
				<td align="center" class="email-background" style="padding: 24px 12px">
					<!--[if mso]>
						<table role="presentation" width="560" align="center" border="0" cellpadding="0" cellspacing="0">
							<tr>
								<td>
					<![endif]-->
					<table
						role="presentation"
						width="100%"
						border="0"
						cellpadding="0"
						cellspacing="0"
						bgcolor="#ffffff"
						style="
							width: 100%;
							max-width: 560px;
							table-layout: fixed;
							border: 1px solid #e4e4e3;
							border-spacing: 0;
							border-collapse: separate;
							border-radius: 16px;
							background-color: #ffffff;
							mso-table-lspace: 0;
							mso-table-rspace: 0;
						"
					>
						<tr>
							<td class="letter-padding" style="padding: 32px 24px">
								<table
									role="presentation"
									width="100%"
									border="0"
									cellpadding="0"
									cellspacing="0"
									style="
										width: 100%;
										border-collapse: collapse;
										mso-table-lspace: 0;
										mso-table-rspace: 0;
									"
								>
									<tr>
										<td width="40" valign="middle" style="width: 40px">
											<img
												src="https://askwenxue.com/assets/wenxue-logo.png"
												width="40"
												height="40"
												alt=""
												style="display: block; width: 40px; height: 40px; border: 0; outline: none"
											/>
										</td>
										<td valign="middle" style="padding-left: 12px">
											<img
												src="https://askwenxue.com/assets/wenxue-slogan.png"
												width="120"
												height="40"
												alt="问学 · ask for everything"
												style="display: block; width: 120px; height: 40px; border: 0; outline: none"
											/>
										</td>
										<td
											align="right"
											valign="middle"
											width="48"
											style="
												width: 48px;
												padding-left: 12px;
												color: #626260;
												font-size: 12px;
												line-height: 18px;
											"
										>
											账号验证
										</td>
									</tr>
								</table>
								<h1
									style="
										margin: 40px 0 12px;
										color: #171717;
										font-size: 28px;
										font-weight: 600;
										line-height: 40px;
									"
								>
									验证你的邮箱
								</h1>
								<p style="margin: 0; color: #525250; font-size: 15px; line-height: 26px">
									请在问学中输入以下验证码，继续完成当前操作。
								</p>
								<table
									role="presentation"
									width="100%"
									border="0"
									cellpadding="0"
									cellspacing="0"
									style="
										width: 100%;
										table-layout: fixed;
										border-collapse: collapse;
										mso-table-lspace: 0;
										mso-table-rspace: 0;
									"
								>
									<tr>
										<td style="padding: 24px 0 0">
											<table
												role="presentation"
												width="100%"
												border="0"
												cellpadding="0"
												cellspacing="0"
												bgcolor="#f5f5f4"
												style="
													width: 100%;
													table-layout: fixed;
													border-collapse: separate;
													border-spacing: 0;
													border-radius: 10px;
													background-color: #f5f5f4;
													mso-table-lspace: 0;
													mso-table-rspace: 0;
												"
											>
												<tr>
													<td align="center" style="padding: 20px 12px 22px">
														<p
															style="
																margin: 0 0 8px;
																color: #626260;
																font-size: 12px;
																line-height: 20px;
															"
														>
															邮箱验证码
														</p>
														<p
															class="verification-code"
															dir="ltr"
															style="
																margin: 0;
																color: #171717;
																font-family:
																	ui-monospace, 'SFMono-Regular', Menlo, Consolas,
																	'Liberation Mono', monospace;
																font-size: 40px;
																font-weight: 600;
																line-height: 52px;
																letter-spacing: 3px;
																word-break: break-all;
																overflow-wrap: anywhere;
															"
														>
															{{.VerificationCode}}
														</p>
													</td>
												</tr>
											</table>
										</td>
									</tr>
								</table>
								<p
									style="
										margin: 16px 0 0;
										color: #626260;
										font-size: 14px;
										line-height: 24px;
										word-break: break-word;
										overflow-wrap: anywhere;
									"
								>
									验证码将在
									<strong style="color: #171717; font-weight: 600">{{.ExpireMinutes}} 分钟</strong
									>后失效，请及时使用。
								</p>
								<p style="margin: 24px 0 0; color: #525250; font-size: 14px; line-height: 24px">
									请勿向他人透露验证码。<br />
									如非本人操作，请忽略此邮件。
								</p>
								<table
									role="presentation"
									width="100%"
									border="0"
									cellpadding="0"
									cellspacing="0"
									style="
										width: 100%;
										border-collapse: collapse;
										mso-table-lspace: 0;
										mso-table-rspace: 0;
									"
								>
									<tr>
										<td style="padding-top: 32px">
											<table
												role="presentation"
												width="100%"
												border="0"
												cellpadding="0"
												cellspacing="0"
												style="
													width: 100%;
													border-collapse: collapse;
													mso-table-lspace: 0;
													mso-table-rspace: 0;
												"
											>
												<tr>
													<td style="padding-top: 20px; border-top: 1px solid #e4e4e3">
														<p
															style="margin: 0; color: #626260; font-size: 12px; line-height: 20px"
														>
															此邮件由问学自动发送，请勿直接回复。
														</p>
														<p style="margin: 6px 0 0; font-size: 12px; line-height: 20px">
															<a
																href="https://askwenxue.com"
																style="
																	color: #525250;
																	text-decoration: underline;
																	text-underline-offset: 3px;
																"
																>askwenxue.com</a
															>
														</p>
													</td>
												</tr>
											</table>
										</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>
					<!--[if mso]>
								</td>
							</tr>
						</table>
					<![endif]-->
				</td>
			</tr>
		</table>
	</body>
</html>
