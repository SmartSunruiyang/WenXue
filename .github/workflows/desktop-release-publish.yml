name: Desktop release publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Desktop release build run id from this exact commit
        required: true
        type: string
      version:
        description: Version sealed by the source build
        required: true
        type: string
      channel:
        description: Update channel sealed by the source build
        required: true
        default: beta
        type: choice
        options:
          - dev
          - beta
          - stable

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-release-publish-${{ github.repository_id }}-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  publish:
    environment: desktop-release-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a protected release ref
        run: test "$GITHUB_REF_PROTECTED" = true
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
      - name: Resolve the trusted source build
        run: >-
          node apps/desktop/scripts/resolve-release-source-run.mjs
          --run-id "$SOURCE_RUN_ID"
          --github-env "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-darwin-arm64
          path: candidate/darwin/arm64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-darwin-x64
          path: candidate/darwin/x64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win32-x64
          path: candidate/win32/x64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release-seal
          path: candidate
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the source seal against downloaded bytes
        run: >-
          node apps/desktop/scripts/release-build-seal.mjs verify
          --release-dir candidate
          --seal candidate/release-build.json
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-commit "$WENXUE_SOURCE_COMMIT"
          --expected-version "$RELEASE_VERSION"
          --expected-channel "$RELEASE_CHANNEL"
          --expected-run-url "$WENXUE_SOURCE_RUN_URL"
          --github-env "$GITHUB_ENV"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          WENXUE_RELEASE_ED25519_PUBLIC_KEY: ${{ vars.WENXUE_RELEASE_ED25519_PUBLIC_KEY }}
      - name: Bind build evidence to the exact installer set
        run: |
          test -n "$WENXUE_SOURCE_RUN_URL"
          WENXUE_RELEASE_RUN_URL="$WENXUE_SOURCE_RUN_URL" \
            node apps/desktop/scripts/create-release-evidence.mjs \
              --release-dir candidate \
              --output candidate/release-evidence.json
      - name: Create the deterministic signed candidate
        run: |
          test -n "$WENXUE_UPDATE_COS_BASE_URL"
          test -n "$WENXUE_RELEASE_ED25519_PRIVATE_KEY"
          test -n "$WENXUE_RELEASE_ED25519_PUBLIC_KEY"
          base_url="${WENXUE_UPDATE_COS_BASE_URL%/}/electron/${RELEASE_CHANNEL}/${RELEASE_VERSION}"
          node apps/desktop/scripts/create-release-candidate.mjs \
            --version "$RELEASE_VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --release-dir candidate \
            --output-dir candidate \
            --base-url "$base_url" \
            --test-evidence candidate/release-evidence.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          WENXUE_UPDATE_COS_BASE_URL: ${{ vars.WENXUE_UPDATE_COS_BASE_URL }}
          WENXUE_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.WENXUE_RELEASE_ED25519_PRIVATE_KEY }}
          WENXUE_RELEASE_ED25519_PUBLIC_KEY: ${{ vars.WENXUE_RELEASE_ED25519_PUBLIC_KEY }}
      - name: Install checksum-pinned COSCLI without credentials
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
          printf '%s  %s\n' \
            '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91' \
            "$RUNNER_TEMP/coscli" | sha256sum --check --strict -
          sudo install -m 0755 "$RUNNER_TEMP/coscli" /usr/local/bin/coscli
          test "$(coscli --version)" = 'coscli version v1.0.8'
      - name: Configure COS CLI credentials
        run: |
          test -n "$COS_SECRET_ID"
          test -n "$COS_SECRET_KEY"
          test -n "$COS_BUCKET"
          test -n "$COS_REGION"
          cp apps/desktop/scripts/coscli.base.yaml "$RUNNER_TEMP/wenxue-cos.yaml"
          coscli config set \
            --secret_id "$COS_SECRET_ID" \
            --secret_key "$COS_SECRET_KEY" \
            --disable-log \
            --config-path "$RUNNER_TEMP/wenxue-cos.yaml"
          coscli config add \
            --bucket "$COS_BUCKET" \
            --region "$COS_REGION" \
            --endpoint "cos.${COS_REGION}.myqcloud.com" \
            --alias wenxue-updates \
            --disable-log \
            --config-path "$RUNNER_TEMP/wenxue-cos.yaml"
        env:
          COS_SECRET_ID: ${{ secrets.WENXUE_UPDATE_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.WENXUE_UPDATE_COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.WENXUE_UPDATE_COS_BUCKET }}
          COS_REGION: ${{ secrets.WENXUE_UPDATE_COS_REGION }}
      - name: Verify COS bucket was never versioned
        run: |
          versioning_status="$(coscli bucket-versioning \
            --method get \
            "cos://${COS_BUCKET}" \
            --log-path "$RUNNER_TEMP/coscli-versioning.log" \
            --config-path "$RUNNER_TEMP/wenxue-cos.yaml" 2>&1)"
          printf '%s\n' "$versioning_status"
          case "$versioning_status" in
            *'bucket versioning status is Closed'*) ;;
            *) echo 'COS bucket was versioned or its state could not be proven closed.' >&2; exit 1 ;;
          esac
        env:
          COS_BUCKET: ${{ secrets.WENXUE_UPDATE_COS_BUCKET }}
      - name: Upload or reuse every immutable candidate object
        run: |
          origin_url="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/"
          node apps/desktop/scripts/publish-immutable-candidate.mjs \
            --release-dir candidate \
            --prefix "electron/${RELEASE_CHANNEL}/${RELEASE_VERSION}" \
            --origin-url "$origin_url" \
            --bucket "$COS_BUCKET" \
            --config "$RUNNER_TEMP/wenxue-cos.yaml"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          COS_BUCKET: ${{ secrets.WENXUE_UPDATE_COS_BUCKET }}
          COS_REGION: ${{ secrets.WENXUE_UPDATE_COS_REGION }}
      - name: Verify the public candidate byte-for-byte
        run: |
          manifest_url="${WENXUE_UPDATE_COS_BASE_URL%/}/electron/${RELEASE_CHANNEL}/${RELEASE_VERSION}/candidate-manifest.json"
          node apps/desktop/scripts/verify-published-candidate.mjs \
            --manifest-url "$manifest_url" \
            --expected-version "$RELEASE_VERSION" \
            --expected-channel "$RELEASE_CHANNEL" \
            --expected-commit "$WENXUE_SOURCE_COMMIT" \
            --registration-output candidate/candidate-registration.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          WENXUE_UPDATE_COS_BASE_URL: ${{ vars.WENXUE_UPDATE_COS_BASE_URL }}
          WENXUE_RELEASE_ED25519_PUBLIC_KEY: ${{ vars.WENXUE_RELEASE_ED25519_PUBLIC_KEY }}
      - name: Register candidate without publishing rollout
        run: |
          case "$WENXUE_RELEASE_REGISTER_URL" in
            https://*) ;;
            *) echo 'WENXUE_RELEASE_REGISTER_URL must use HTTPS' >&2; exit 1 ;;
          esac
          curl --fail-with-body --retry 4 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $WENXUE_RELEASE_CI_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @candidate/candidate-registration.json \
            "$WENXUE_RELEASE_REGISTER_URL"
        env:
          WENXUE_RELEASE_CI_TOKEN: ${{ secrets.WENXUE_RELEASE_CI_TOKEN }}
          WENXUE_RELEASE_REGISTER_URL: ${{ secrets.WENXUE_RELEASE_REGISTER_URL }}
      - name: Remove ephemeral COS credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/wenxue-cos.yaml"
